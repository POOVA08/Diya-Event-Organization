<!DOCTYPE html>
<html>

<head>
    <title>Diya Event Organization</title>

    <style>
        body {
            margin: 0;
            overflow-x: hidden;
            font-family: Arial, sans-serif;
        }

        .video-bg {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
        }

        /* VIDEO BACKGROUND */
        .video-bg video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
            pointer-events: none;
        }

        /* TOP LOGO */
        .top {
            position: absolute;
            top: 20px;
            left: 30px;
            color: white;
            font-size: 28px;
            font-weight: bold;
            z-index: 100;
        }

        /* CENTER CONTENT */
        .text-container {
            position: relative;
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .center {
            font-size: 45px;
            font-weight: bold;
        }

        .center-1 {
            font-size: 20px;
            margin-top: 10px;
        }

        /* BUTTONS */
        .btn-group {
            margin-top: 25px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn,
        .btn2 {
            padding: 15px 25px;
            background: deeppink;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 16px;
            transition: 0.3s;
            position: relative;
            z-index: 200;
        }

        .btn:hover,
        .btn2:hover {
            background: hotpink;
            transform: scale(1.05);
        }

        @media(max-width:768px) {
            .center {
                font-size: 30px;
            }

            .center-1 {
                font-size: 16px;
            }

            .top {
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="video-bg">

        <video autoplay muted loop playsinline>
            <source src="Media/Home/v3.mp4" type="video/mp4">
        </video>

        <div class="top">
            Diya Event Organization
        </div>

        <div class="text-container">

            <div class="center">
                Creating Unforgettable Moments
            </div>

            <div class="center-1">
                We Plan Beautiful Memories for You
            </div>

            <div class="btn-group">

                <a href="Events.html" class="btn">
                    Plan Your Dream Event With Us
                </a>

                <a href="Contact.html" class="btn2">
                    Contact Us
                </a>

            </div>

        </div>

    </div>

</body>

</html>
