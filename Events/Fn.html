<!DOCTYPE html>
 <html>
  <head>
    <title>Fn's</title>
    <style>/* RESET */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

/* BODY */
body{
    overflow:hidden;
}

/* BACKGROUND */
.background{
    width:100%;
    min-height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
    linear-gradient(rgba(0,0,0,0.4),
    rgba(0,0,0,0.4)),
    url("../Media/Home/H5.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

/* CARD */
.card{
    width:380px;
    padding:35px;

    background:rgba(255,255,255,0.12);
    backdrop-filter:blur(8px);

    border-radius:20px;

    text-align:center;
    color:white;

    border:1px solid rgba(255,255,255,0.2);

    box-shadow:0 8px 20px rgba(0,0,0,0.5);

    transition:0.3s;
}

.card:hover{
    transform:scale(1.03);
}

/* HEADING */
.card h2{
    margin-bottom:25px;

    color:#FFD700;

    font-size:32px;

    text-shadow:0 0 10px black;
}

/* LIST */
.eventlist{
    list-style:none;
}

/* LIST ITEMS */
.eventlist li{
    margin:18px 0;
}

/* LINKS */
.eventlist a{
    text-decoration:none;

    color:white;

    font-size:20px;
    font-weight:bold;

    padding:10px 15px;

    display:block;

    border-radius:10px;

    background:rgba(255,255,255,0.08);

    transition:0.3s;
}

/* HOVER */
.eventlist a:hover{
    background:linear-gradient(to right,#ff1493,#8e2de2);

    color:#FFD700;

    transform:translateX(5px);
}

    </style>
</style>
  </head>
  <body>
    <div class="background">
    <div class="card">
     <h2>Conduct to this Functions</h2>
     <ul class="eventlist">
       <li><a href="../Media/Fns/2.png" target="_blank">
         B'day Fn</a></li>
       <li><a href="../Media/Fns/4.png" target="_blank">
         Babyshower</a></li>
       <li><a href="../Media/Fns/5.png" target="_blank">
         Surprise Gift</a></li>
       <li><a href="../Media/Fns/1.png" target="_blank">
         Marriage</a></li>
       <li><a href="../Media/Fns/Meets.png" target="_blank">
         Meeting</a></li>
       <li><a href="../Media/Fns/6.png" target="_blank">
         Party</a></li>
       <li><a href="../Media/Fns/3.png" target="_blank">
         Puberty</a></li>
     </ul>
     </div>
    </div>
  </body>
 </html>
